<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1f4037, #99f2c8);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            color: white;
        }

        .table {
            color: white;
        }

        .table thead {
            background: rgba(0,0,0,0.3);
        }

        .btn-custom {
            background-color: #00c9a7;
            border: none;
        }

        .btn-custom:hover {
            background-color: #00a78e;
        }

        .delete-btn {
            background-color: #ff4d6d;
            border: none;
        }

        .delete-btn:hover {
            background-color: #e63956;
        }

        h2 {
            font-weight: 600;
        }

        .total-box {
            font-size: 1.3rem;
            font-weight: 500;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="text-center text-white mb-4">
        <h2>💰 Expense Tracker</h2>
        <p>Track. Analyze. Control your spending.</p>
    </div>

    <div class="glass-card shadow-lg mb-4">

        <form action="/add" method="POST" class="row g-3">

            <div class="col-md-3">
                <input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required>
            </div>

            <div class="col-md-3">
                <input type="text" name="category" class="form-control" placeholder="Category" required>
            </div>

            <div class="col-md-4">
                <input type="text" name="description" class="form-control" placeholder="Description" required>
            </div>

            <div class="col-md-2">
                <button type="submit" class="btn btn-custom w-100 text-white">Add</button>
            </div>

        </form>

    </div>

    <div class="glass-card shadow-lg">

        <div class="total-box">
            Total Spent: ₹ {{ total }}
        </div>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for expense in expenses %}
                <tr>
                    <td>{{ expense[0] }}</td>
                    <td>₹ {{ expense[1] }}</td>
                    <td>{{ expense[2] }}</td>
                    <td>{{ expense[3] }}</td>
                    <td>
                        <a href="/delete/{{ expense[0] }}" class="btn delete-btn btn-sm text-white">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
